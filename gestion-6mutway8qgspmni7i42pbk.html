<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Gestion — Atélia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--cream:#FAF8F5;--blanc:#fff;--violet:#3B2A52;--mid:#6B5C7D;--clair:#9B8CA8;--pale:#F3EFF5;--bord:#EAE4EC;--rouge:#A33B3B}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;background:var(--cream);color:var(--violet);font-size:14px;line-height:1.6}
.serif{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400}
.wrap{max-width:920px;margin:0 auto;padding:0 22px}

header{background:var(--blanc);border-bottom:1px solid var(--bord);position:sticky;top:0;z-index:40}
header .wrap{display:flex;align-items:center;justify-content:space-between;padding-top:14px;padding-bottom:14px;gap:14px;flex-wrap:wrap}
header .logo{font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;letter-spacing:.5px}
header .actions{display:flex;gap:10px;align-items:center}
.etat{font-size:12px;color:var(--clair)}

button,.btn{font-family:inherit;font-size:11.5px;letter-spacing:1.1px;text-transform:uppercase;padding:10px 18px;border:1px solid var(--violet);background:var(--violet);color:var(--cream);cursor:pointer;transition:opacity .2s}
button:hover{opacity:.85}
button.leger{background:transparent;color:var(--violet);border-color:#C9BED2}
button.mini{padding:5px 11px;font-size:10px;letter-spacing:.8px}
button.danger{background:transparent;color:var(--rouge);border-color:#E0C4C4}
button:disabled{opacity:.45;cursor:default}

input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--bord);background:var(--blanc);font-family:inherit;font-size:13.5px;color:var(--violet);border-radius:0}
input:focus,textarea:focus{outline:none;border-color:var(--clair)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--mid);margin-bottom:5px}
.champ{margin-bottom:14px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.aide{font-size:11.5px;color:var(--clair);margin-top:4px}

/* connexion */
#connexion{max-width:380px;margin:14vh auto;background:var(--blanc);border:1px solid var(--bord);padding:34px 30px;text-align:center}
#connexion h1{font-size:27px;margin-bottom:8px}
#connexion p{font-size:13px;color:var(--mid);margin-bottom:22px}
#connexion input{text-align:center;font-size:24px;letter-spacing:10px;padding:12px}
.message{font-size:12.5px;margin-top:14px;min-height:18px}
.message.ko{color:var(--rouge)}
.message.ok{color:#3B7A4A}

/* catégories */
.cat{background:var(--blanc);border:1px solid var(--bord);margin-bottom:14px}
.cat.glisse{opacity:.4}
.cat-tete{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer}
.poignee{cursor:grab;color:var(--clair);font-size:17px;line-height:1;user-select:none;padding:2px 4px}
.cat-tete h2{font-size:19px;flex:1;font-family:"Cormorant Garamond",Georgia,serif;font-weight:400}
.compte{font-size:11.5px;color:var(--clair)}
.chevron{color:var(--clair);transition:transform .2s}
.cat.ouvert .chevron{transform:rotate(90deg)}
.cat-corps{display:none;padding:0 16px 18px;border-top:1px solid var(--bord)}
.cat.ouvert .cat-corps{display:block}
.section-titre{font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--clair);margin:22px 0 10px;padding-top:14px;border-top:1px solid var(--bord)}

/* produits */
.prod{border:1px solid var(--bord);background:var(--cream);margin-bottom:10px}
.prod.glisse{opacity:.4}
.prod-tete{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer}
.prod-tete h3{font-size:14px;flex:1;font-weight:500}
.prod-corps{display:none;padding:4px 12px 14px;border-top:1px solid var(--bord)}
.prod.ouvert .prod-corps{display:block}

/* photos */
.photos{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:10px}
.ph{position:relative;width:88px}
.ph.glisse{opacity:.35}
.ph img{width:88px;height:88px;object-fit:cover;display:block;background:var(--pale);cursor:grab;border:1px solid var(--bord)}
.ph .sup{position:absolute;top:2px;right:2px;background:rgba(59,42,82,.88);color:#fff;border:none;width:19px;height:19px;padding:0;font-size:13px;line-height:1;cursor:pointer;letter-spacing:0}
.ph input{font-size:10.5px;padding:4px 5px;margin-top:3px}
.ph .rang{position:absolute;top:2px;left:2px;background:rgba(255,255,255,.9);font-size:10px;padding:1px 5px;color:var(--violet)}
.ajout{width:88px;height:88px;border:1px dashed #C9BED2;background:transparent;color:var(--clair);font-size:22px;cursor:pointer;padding:0;letter-spacing:0}

.apercu-bouton{font-size:12px;color:var(--mid);padding:9px 0;line-height:1.5}
.pastille{display:inline-block;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:2px 8px;border:1px solid var(--bord);color:var(--clair)}
.pastille.dispo{color:#3B7A4A;border-color:#CBDCCE}
.pastille.rupture{color:var(--rouge);border-color:#E0C4C4}
.vide{text-align:center;color:var(--clair);font-size:13px;padding:26px}
footer.barre{position:sticky;bottom:0;background:var(--blanc);border-top:1px solid var(--bord);padding:12px 0;margin-top:26px}
footer.barre .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.masque{display:none!important}
@media(max-width:620px){.duo{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ===================== CONNEXION ===================== -->
<div id="connexion">
  <h1 class="serif">Atélia</h1>
  <p id="etape-texte">Un code à six chiffres va être envoyé sur votre adresse email.</p>

  <div id="etape-demande">
    <button id="btn-code" style="width:100%">Recevoir mon code</button>
  </div>

  <div id="etape-code" class="masque">
    <div class="champ">
      <input id="code" inputmode="numeric" maxlength="6" placeholder="······" autocomplete="one-time-code">
    </div>
    <button id="btn-entrer" style="width:100%">Entrer</button>
    <p style="margin-top:14px"><button id="btn-renvoyer" class="leger mini">Renvoyer un code</button></p>
  </div>

  <p class="message" id="msg-connexion"></p>
</div>

<!-- ===================== GESTION ===================== -->
<div id="gestion" class="masque">

  <header>
    <div class="wrap">
      <span class="logo">Atélia — gestion</span>
      <div class="actions">
        <span class="etat" id="etat"></span>
        <button class="leger mini" id="btn-voir">Voir le site</button>
        <button class="leger mini" id="btn-sortir">Sortir</button>
      </div>
    </div>
  </header>

  <main class="wrap" style="padding-top:26px">
    <p style="font-size:13px;color:var(--mid);margin-bottom:20px">
      Faites glisser les blocs par leur poignée <span style="color:var(--clair)">⠿</span>
      pour changer l'ordre d'affichage sur le site. La première photo d'une liste est celle qu'on voit en premier.
    </p>
    <div id="cats"></div>
    <p style="margin:18px 0 40px"><button class="leger" id="btn-cat">+ Nouvelle catégorie</button></p>
  </main>

  <footer class="barre">
    <div class="wrap">
      <span class="etat" id="etat-bas">Aucune modification</span>
      <div class="actions">
        <button class="leger" id="btn-annuler">Annuler mes modifications</button>
        <button id="btn-publier">Publier</button>
      </div>
    </div>
  </footer>
</div>

<script>
(function () {
  'use strict';

  var JETON = sessionStorage.getItem('atelia_jeton') || '';
  var DATA = { categories: [] };
  var MODIF = false;

  var $ = function (id) { return document.getElementById(id); };
  var esc = function (t) {
    return String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  };

  var LOCAL = location.protocol === 'file:';

  function api(chemin, options) {
    if (LOCAL) {
      return Promise.reject(new Error(
        "Cette page ne fonctionne qu'une fois le site en ligne. " +
        "Ouvrez-la depuis votre adresse en .pages.dev, pas depuis votre dossier."));
    }
    options = options || {};
    options.headers = options.headers || {};
    if (JETON) options.headers.authorization = 'Bearer ' + JETON;
    return fetch(chemin, options).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (!r.ok) throw new Error(d.erreur || traduis(r.status));
        return d;
      });
    }).catch(function (e) {
      if (e instanceof TypeError) {
        throw new Error("Le serveur n'a pas répondu. Vérifiez que le site est bien en ligne " +
                        "et que le stockage est configuré sur Cloudflare.");
      }
      throw e;
    });
  }

  function traduis(statut) {
    if (statut === 404) return "Les fonctions du site ne sont pas actives. " +
      "Vérifiez que le dossier « functions » a bien été déposé sur Cloudflare.";
    if (statut === 500) return "Le stockage n'est pas configuré. " +
      "Ajoutez l'espace KV nommé ATELIA dans les réglages Cloudflare.";
    return 'Erreur ' + statut;
  }

  /* ---------------- connexion ---------------- */

  function message(texte, ok) {
    var m = $('msg-connexion');
    m.textContent = texte;
    m.className = 'message ' + (texte ? (ok ? 'ok' : 'ko') : '');
  }

  function demandeCode() {
    message('Envoi en cours…', true);
    $('btn-code').disabled = true;
    $('btn-renvoyer').disabled = true;
    api('/api/code', { method: 'POST' })
      .then(function (d) {
        $('etape-demande').classList.add('masque');
        $('etape-code').classList.remove('masque');
        $('etape-texte').textContent = 'Code envoyé à ' + (d.vers || 'votre adresse') +
          '. Il est valable dix minutes.';
        message('', true);
        $('code').focus();
      })
      .catch(function (e) { message(e.message, false); })
      .then(function () {
        $('btn-code').disabled = false;
        $('btn-renvoyer').disabled = false;
      });
  }

  function verifieCode() {
    var c = $('code').value.trim();
    if (!/^\d{6}$/.test(c)) { message('Entrez les six chiffres du code.', false); return; }
    $('btn-entrer').disabled = true;
    message('Vérification…', true);
    api('/api/verifier', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ code: c })
    })
      .then(function (d) {
        JETON = d.jeton;
        sessionStorage.setItem('atelia_jeton', JETON);
        ouvreGestion();
      })
      .catch(function (e) { message(e.message, false); $('code').select(); })
      .then(function () { $('btn-entrer').disabled = false; });
  }

  $('btn-code').addEventListener('click', demandeCode);
  $('btn-renvoyer').addEventListener('click', demandeCode);
  $('btn-entrer').addEventListener('click', verifieCode);
  $('code').addEventListener('keydown', function (e) { if (e.key === 'Enter') verifieCode(); });

  /* ---------------- chargement ---------------- */

  function ouvreGestion() {
    $('connexion').classList.add('masque');
    $('gestion').classList.remove('masque');
    charge();
  }

  function charge() {
    etat('Chargement…');
    api('/api/catalogue')
      .then(function (d) {
        if (d && d.categories) { DATA = d; affiche(); etat(''); return; }
        return fetch('data/catalogue.json').then(function (r) { return r.json(); })
          .then(function (d2) {
            DATA = d2;
            affiche();
            etat('Catalogue de départ chargé — publiez pour l\'enregistrer.');
          });
      })
      .catch(function (e) { etat('Impossible de charger : ' + e.message); });
  }

  function etat(t) { $('etat').textContent = t; }
  function marque() {
    MODIF = true;
    $('etat-bas').textContent = 'Modifications non publiées';
    $('etat-bas').style.color = 'var(--rouge)';
  }

  /* ---------------- affichage ---------------- */

  function affiche() {
    var z = $('cats');
    if (!DATA.categories.length) {
      z.innerHTML = '<p class="vide">Aucune catégorie. Créez-en une pour commencer.</p>';
      return;
    }
    z.innerHTML = DATA.categories.map(function (c, i) { return blocCat(c, i); }).join('');
    branche();
  }

  function blocCat(c, i) {
    return '' +
    '<div class="cat" data-i="' + i + '" draggable="false">' +
      '<div class="cat-tete">' +
        '<span class="poignee" draggable="true" title="Glisser pour réordonner">⠿</span>' +
        '<h2>' + esc(c.titre || 'Sans nom') + '</h2>' +
        '<span class="compte">' + (c.produits || []).length + ' produit(s)</span>' +
        '<span class="chevron">›</span>' +
      '</div>' +
      '<div class="cat-corps">' +

        '<div class="section-titre" style="border:none;padding-top:16px">La catégorie</div>' +
        '<div class="duo">' +
          champ('Nom affiché', 'titre', c.titre, i) +
          champ('Adresse de la page', 'id', c.id, i, 'minuscules, sans accent ni espace') +
        '</div>' +
        '<div class="duo">' +
          champ('Petite étiquette', 'etiquette', c.etiquette, i, 'exemple : Couture') +
          champ('Surtitre de la page', 'eyebrow', c.eyebrow, i) +
        '</div>' +
        zone('Résumé (page Créations)', 'resume', c.resume, i) +
        zone('Introduction de la page', 'intro', c.intro, i) +
        '<div class="duo">' +
          champ('Prix sur la vignette', 'prix_affiche', c.prix_affiche, i, 'exemple : à partir de 12 €') +
          champ('Précision sous le prix', 'prix_note', c.prix_note, i) +
        '</div>' +

        '<div class="section-titre">Photos du carrousel · page Créations</div>' +
        photos(c.photos_apercu, i, null, 'apercu') +

        '<div class="section-titre">Photos d\'ambiance en haut de page</div>' +
        photos(c.photos_entete, i, null, 'entete') +

        '<div class="section-titre">Produits</div>' +
        '<div class="prods">' +
          (c.produits || []).map(function (p, j) { return blocProd(p, i, j); }).join('') +
        '</div>' +
        '<button class="leger mini" data-action="prod+" data-i="' + i + '">+ Ajouter un produit</button>' +

        '<div class="section-titre">Bas de page</div>' +
        champ('Titre', 'bas_de_page_titre', c.bas_de_page_titre, i) +
        zone('Texte', 'bas_de_page_texte', c.bas_de_page_texte, i) +

        '<div class="section-titre">&nbsp;</div>' +
        '<button class="danger mini" data-action="cat-" data-i="' + i + '">Supprimer cette catégorie</button>' +
      '</div>' +
    '</div>';
  }

  function blocProd(p, i, j) {
    return '' +
    '<div class="prod" data-i="' + i + '" data-j="' + j + '">' +
      '<div class="prod-tete">' +
        '<span class="poignee" draggable="true">⠿</span>' +
        '<h3>' + esc(p.titre || 'Sans nom') + '</h3>' +
        '<span class="compte">' + resumeProd(p) + '</span>' +
        '<span class="chevron">›</span>' +
      '</div>' +
      '<div class="prod-corps">' +
        '<div class="duo">' +
          champ('Nom du produit', 'titre', p.titre, i, '', j) +
          champ('Petite étiquette', 'etiquette', p.etiquette, i, '', j) +
        '</div>' +
        zone('Description', 'description', p.description, i, j) +
        '<div class="duo">' +
          champ('Prix', 'prix', p.prix, i, 'vide = « Photos à venir »', j) +
          champ('Précision sous le prix', 'note', p.note, i, '', j) +
        '</div>' +
        '<div class="duo">' +
          champ('Stock', 'stock', p.stock, i, '0 = épuisé · 1 ou plus = en stock · vide = rien affiché', j) +
          '<div class="champ"><label>Ce que verra le visiteur</label>' +
            '<p class="apercu-bouton">' + apercuBouton(p) + '</p></div>' +
        '</div>' +
        champ('Sous-catégorie (filtre)', 'filtre', p.filtre, i, 'laisser vide s\'il n\'y a pas de filtres', j) +
        '<div class="duo">' +
          champ('Format d\'envoi', 'envoi', p.envoi || 'lettre', i, 'lettre = enveloppe (3,60 €) · colis = objet épais (7,59 €)', j) +
          champ('Personnalisable', 'personnalisable', p.personnalisable, i, 'prenom = le visiteur passe par le formulaire · vide sinon', j) +
        '</div>' +
        champ('Lien de paiement Stripe', 'lien_paiement', p.lien_paiement, i, 'laisser vide, le panier suffit', j) +
        '<label style="margin-top:6px">Photos du produit</label>' +
        photos(p.photos, i, j, 'produit') +
        '<button class="danger mini" data-action="prod-" data-i="' + i + '" data-j="' + j + '">Supprimer ce produit</button>' +
      '</div>' +
    '</div>';
  }

  function resumeProd(p) {
    var n = (p.stock === '' || p.stock == null) ? null : parseInt(p.stock, 10);
    var etat = n === 0 ? ' · épuisé' : (n > 0 ? ' · en stock (' + n + ')' : '');
    return (p.photos || []).length + ' photo(s)' + (p.prix ? ' · ' + p.prix : '') + etat;
  }

  function apercuBouton(p) {
    var n = (p.stock === '' || p.stock == null) ? null : parseInt(p.stock, 10);
    if (n === 0) return '<span class="pastille rupture">Épuisé</span> → Passer commande';
    var etat = (n > 0) ? '<span class="pastille dispo">En stock</span> ' : '';
    if (p.personnalisable === 'prenom') return etat + '→ Personnaliser';
    if (!p.prix || !/[0-9]/.test(p.prix)) return etat + '→ Me contacter';
    return etat + '→ Ajouter au panier';
  }

  function champ(label, cle, val, i, aide, j) {
    return '<div class="champ"><label>' + label + '</label>' +
      '<input data-cle="' + cle + '" data-i="' + i + '"' +
      (j != null ? ' data-j="' + j + '"' : '') + ' value="' + esc(val || '') + '">' +
      (aide ? '<p class="aide">' + aide + '</p>' : '') + '</div>';
  }

  function zone(label, cle, val, i, j) {
    return '<div class="champ"><label>' + label + '</label>' +
      '<textarea data-cle="' + cle + '" data-i="' + i + '"' +
      (j != null ? ' data-j="' + j + '"' : '') + '>' + esc(val || '') + '</textarea></div>';
  }

  function photos(liste, i, j, type) {
    liste = liste || [];
    var attrs = 'data-i="' + i + '"' + (j != null ? ' data-j="' + j + '"' : '') + ' data-type="' + type + '"';
    return '<div class="photos" ' + attrs + '>' +
      liste.map(function (ph, k) {
        return '<div class="ph" data-k="' + k + '">' +
          '<span class="rang">' + (k + 1) + '</span>' +
          '<button class="sup" data-action="photo-" ' + attrs + ' data-k="' + k + '" title="Retirer">×</button>' +
          '<img src="' + esc(ph.image) + '" alt="" draggable="true">' +
          '<input data-photo-alt ' + attrs + ' data-k="' + k + '" value="' + esc(ph.alt || '') +
            '" placeholder="description">' +
        '</div>';
      }).join('') +
      '<button class="ajout" data-action="photo+" ' + attrs + ' title="Ajouter une photo">+</button>' +
    '</div>';
  }

  /* ---------------- interactions ---------------- */

  function branche() {
    document.querySelectorAll('.cat-tete, .prod-tete').forEach(function (t) {
      t.addEventListener('click', function (e) {
        if (e.target.closest('.poignee')) return;
        t.parentNode.classList.toggle('ouvert');
      });
    });

    document.querySelectorAll('#cats input[data-cle], #cats textarea[data-cle]').forEach(function (el) {
      el.addEventListener('input', function () {
        var i = +el.dataset.i, j = el.dataset.j;
        var cible = (j === undefined) ? DATA.categories[i] : DATA.categories[i].produits[+j];
        cible[el.dataset.cle] = el.value;
        marque();
        if (el.dataset.cle === 'stock' || el.dataset.cle === 'prix') {
          var bloc = el.closest('.prod');
          var vue = bloc && bloc.querySelector('.apercu-bouton');
          if (vue) vue.innerHTML = apercuBouton(cible);
        }
      });
    });

    document.querySelectorAll('[data-photo-alt]').forEach(function (el) {
      el.addEventListener('input', function () {
        listePhotos(el)[+el.dataset.k].alt = el.value;
        marque();
      });
    });

    document.querySelectorAll('[data-action]').forEach(function (b) {
      b.addEventListener('click', function (e) { e.stopPropagation(); action(b); });
    });

    glisser('.cat', '#cats', function (de, vers) {
      deplace(DATA.categories, de, vers);
    });

    document.querySelectorAll('.prods').forEach(function (z) {
      var i = +z.parentNode.parentNode.dataset.i;
      glisser('.prod', z, function (de, vers) { deplace(DATA.categories[i].produits, de, vers); });
    });

    document.querySelectorAll('.photos').forEach(function (z) {
      glisserPhotos(z);
    });
  }

  function listePhotos(el) {
    var i = +el.dataset.i, j = el.dataset.j, type = el.dataset.type;
    var c = DATA.categories[i];
    if (type === 'apercu') return c.photos_apercu = c.photos_apercu || [];
    if (type === 'entete') return c.photos_entete = c.photos_entete || [];
    var p = c.produits[+j];
    return p.photos = p.photos || [];
  }

  function action(b) {
    var a = b.dataset.action, i = +b.dataset.i, j = b.dataset.j;

    if (a === 'cat-') {
      if (!confirm('Supprimer « ' + (DATA.categories[i].titre || '') + ' » et tous ses produits ?')) return;
      DATA.categories.splice(i, 1); marque(); affiche(); return;
    }
    if (a === 'prod+') {
      DATA.categories[i].produits = DATA.categories[i].produits || [];
      DATA.categories[i].produits.push({ titre: 'Nouveau produit', description: '', prix: '', note: '', stock: '1', envoi: 'lettre', personnalisable: '', lien_paiement: '', filtre: '', etiquette: '', photos: [] });
      marque(); affiche(); ouvre(i); return;
    }
    if (a === 'prod-') {
      if (!confirm('Supprimer ce produit ?')) return;
      DATA.categories[i].produits.splice(+j, 1); marque(); affiche(); ouvre(i); return;
    }
    if (a === 'photo-') {
      listePhotos(b).splice(+b.dataset.k, 1); marque(); affiche(); ouvre(i, j); return;
    }
    if (a === 'photo+') { televerse(b); return; }
  }

  function ouvre(i, j) {
    var c = document.querySelector('.cat[data-i="' + i + '"]');
    if (c) c.classList.add('ouvert');
    if (j !== undefined && j !== null) {
      var p = document.querySelector('.prod[data-i="' + i + '"][data-j="' + j + '"]');
      if (p) p.classList.add('ouvert');
    }
  }

  function televerse(b) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/jpeg,image/png,image/webp';
    input.multiple = true;
    input.addEventListener('change', function () {
      var fichiers = Array.prototype.slice.call(input.files);
      if (!fichiers.length) return;
      var liste = listePhotos(b);
      var i = b.dataset.i, j = b.dataset.j;
      etat('Envoi de ' + fichiers.length + ' photo(s)…');

      fichiers.reduce(function (chaine, f) {
        return chaine.then(function () {
          var fd = new FormData();
          fd.append('photo', f);
          return api('/api/photo', { method: 'POST', body: fd })
            .then(function (d) { liste.push({ image: d.url, alt: '' }); });
        });
      }, Promise.resolve())
        .then(function () { marque(); affiche(); ouvre(+i, j); etat(''); })
        .catch(function (e) { etat(''); alert('Envoi impossible : ' + e.message); });
    });
    input.click();
  }

  function deplace(tab, de, vers) {
    var x = tab.splice(de, 1)[0];
    tab.splice(vers, 0, x);
  }

  /* glisser-déposer des blocs */
  function glisser(selecteur, conteneur, apres) {
    var zone = typeof conteneur === 'string' ? document.querySelector(conteneur) : conteneur;
    if (!zone) return;
    var blocs = Array.prototype.slice.call(zone.querySelectorAll(':scope > ' + selecteur));
    var origine = null;

    blocs.forEach(function (bloc, idx) {
      var p = bloc.querySelector(':scope > .cat-tete > .poignee, :scope > .prod-tete > .poignee');
      if (!p) return;

      p.addEventListener('dragstart', function (e) {
        origine = idx;
        bloc.classList.add('glisse');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(idx));
      });
      p.addEventListener('dragend', function () { bloc.classList.remove('glisse'); });

      bloc.addEventListener('dragover', function (e) { e.preventDefault(); });
      bloc.addEventListener('drop', function (e) {
        e.preventDefault(); e.stopPropagation();
        var de = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (isNaN(de) || de === idx) return;
        apres(de, idx);
        marque(); affiche();
      });
    });
  }

  /* glisser-déposer des photos */
  function glisserPhotos(zone) {
    var vignettes = Array.prototype.slice.call(zone.querySelectorAll('.ph'));
    vignettes.forEach(function (v, idx) {
      var img = v.querySelector('img');
      img.addEventListener('dragstart', function (e) {
        v.classList.add('glisse');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(idx));
      });
      img.addEventListener('dragend', function () { v.classList.remove('glisse'); });
      v.addEventListener('dragover', function (e) { e.preventDefault(); });
      v.addEventListener('drop', function (e) {
        e.preventDefault(); e.stopPropagation();
        var de = parseInt(e.dataTransfer.getData('text/plain'), 10);
        if (isNaN(de) || de === idx) return;
        var liste = listePhotos(zone);
        deplace(liste, de, idx);
        marque(); affiche();
        ouvre(+zone.dataset.i, zone.dataset.j);
      });
    });
  }

  /* ---------------- barre du bas ---------------- */

  $('btn-cat').addEventListener('click', function () {
    DATA.categories.push({
      titre: 'Nouvelle catégorie',
      id: 'nouvelle-' + Math.random().toString(36).slice(2, 6),
      etiquette: '', resume: '', intro: '',
      eyebrow: 'Créations · Faits main',
      prix_affiche: '', prix_note: '',
      photos_apercu: [], photos_entete: [], filtres: [],
      produits: [],
      bas_de_page_titre: 'Je fabrique aussi sur commande',
      bas_de_page_texte: "Dites-moi ce que vous avez en tête et je vous dis si c'est faisable."
    });
    marque(); affiche();
    ouvre(DATA.categories.length - 1);
    window.scrollTo(0, document.body.scrollHeight);
  });

  $('btn-publier').addEventListener('click', function () {
    $('btn-publier').disabled = true;
    $('etat-bas').style.color = 'var(--clair)';
    $('etat-bas').textContent = 'Publication…';
    api('/api/catalogue', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(DATA)
    })
      .then(function () {
        MODIF = false;
        $('etat-bas').textContent = 'Publié — le site est à jour';
        $('etat-bas').style.color = '#3B7A4A';
      })
      .catch(function (e) {
        $('etat-bas').textContent = e.message;
        $('etat-bas').style.color = 'var(--rouge)';
      })
      .then(function () { $('btn-publier').disabled = false; });
  });

  $('btn-annuler').addEventListener('click', function () {
    if (MODIF && !confirm('Abandonner les modifications non publiées ?')) return;
    MODIF = false;
    $('etat-bas').textContent = 'Aucune modification';
    $('etat-bas').style.color = 'var(--clair)';
    charge();
  });

  $('btn-voir').addEventListener('click', function () { window.open('creations.html', '_blank'); });

  $('btn-sortir').addEventListener('click', function () {
    if (MODIF && !confirm('Vous avez des modifications non publiées. Sortir quand même ?')) return;
    sessionStorage.removeItem('atelia_jeton');
    location.reload();
  });

  window.addEventListener('beforeunload', function (e) {
    if (MODIF) { e.preventDefault(); e.returnValue = ''; }
  });

  /* ---------------- démarrage ---------------- */

  if (LOCAL) {
    $('etape-texte').innerHTML =
      "Cette page ne fonctionne qu'une fois le site en ligne.<br><br>" +
      "Déposez le dossier sur Cloudflare, puis revenez ici depuis votre adresse " +
      "en <strong>.pages.dev</strong>. Le guide détaille les étapes.";
    $('btn-code').disabled = true;
    $('btn-code').textContent = 'Indisponible hors ligne';
  } else if (JETON) {
    api('/api/catalogue').then(ouvreGestion).catch(function () {
      sessionStorage.removeItem('atelia_jeton');
      JETON = '';
    });
  }
})();
</script>

</body>
</html>
